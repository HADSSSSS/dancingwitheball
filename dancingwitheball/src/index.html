<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>dancingwitheball</title>  <!-- ① 브라우저 탭 제목 (배포 파일 이름도 이걸 따라감) -->

<!-- 홈 화면 추가 / 앱 설치용 정보 -->
<meta name="theme-color" content="#0f1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dancingwitheball">  <!-- ② 아이폰 홈 화면 아이콘 아래 이름 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<!-- 스타일 -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 상단 바: 점수 + 버튼 -->
  <div id="hud">
    <div class="stats">
      <div class="stat"><small>스테이지</small><b id="lvl">1</b></div>
      <div class="stat best"><small>최고</small><b id="best">1</b></div>
    </div>
    <div class="btns">
      <button id="speedBtn" title="빠르게 (F)">⏩<span class="lbl">2배</span></button>
      <button id="recallBtn" title="공 회수 (R)" disabled>⤓<span class="lbl">회수</span></button>
      <button id="modeBtn" title="조준 방식 전환">↑<span class="lbl">스와이프</span></button>
      <button id="soundBtn" title="소리 (M)">🔊</button>
      <button id="newBtn" title="새 게임">↺<span class="lbl">새로</span></button>
    </div>
  </div>

  <!-- 게임 화면 + 게임 오버 창 -->
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="over">
      <h2>게임 오버</h2>
      <p id="overMsg"></p>
      <button id="revive">💖 부활하기 <span id="reviveLeft"></span></button>
      <p id="reviveInfo"></p>
      <button id="restart">다시 하기</button>
    </div>
  </div>

  <!-- 조작 안내 -->
  <div id="hint">화면을 위로 스와이프(드래그)해서 조준하고, 손을 떼면 발사!</div>
  <div id="ver"></div>
</div>

<!-- 스크립트: 순서가 중요해요 (위 파일의 값을 아래 파일이 사용) -->
<script src="js/config.js"></script>   <!-- ★ 난이도·판 크기·속도 등 설정값 -->
<script src="js/storage.js"></script>  <!-- 저장/불러오기 도우미 -->
<script src="js/audio.js"></script>    <!-- 효과음 -->
<script src="js/state.js"></script>    <!-- 게임 상태, 새 게임, 자동 저장 -->
<script src="js/level.js"></script>    <!-- 벽돌 줄 생성, 벽돌 색 -->
<script src="js/physics.js"></script>  <!-- 공 충돌·반사 -->
<script src="js/aim.js"></script>      <!-- 조준 방향, 조준선, 발사 -->
<script src="js/input.js"></script>    <!-- 마우스/터치/키보드 입력 -->
<script src="js/ui.js"></script>       <!-- 버튼, 점수판, 화면 크기 -->
<script src="js/game.js"></script>     <!-- 매 프레임 진행, 턴 종료 -->
<script src="js/render.js"></script>   <!-- 화면 그리기, 파티클 -->
<script src="js/main.js"></script>     <!-- 시작 -->
</body>
</html>
